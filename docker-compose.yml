services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicle_system
      POSTGRES_USER: vehicle_system
      POSTGRES_PASSWORD: vehicle_system
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
